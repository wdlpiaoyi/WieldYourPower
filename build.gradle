plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = "${project.minecraft_version}-forge-${project.mod_version}"
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Cloth Config is a required dependency now; the jar is read from your modpack mods folder
// (override with -PmodpackModsDir=...). The build fails if it is missing.
def modpackModsDir = project.findProperty('modpackModsDir') ?: 'libs'
def clothJars = fileTree(dir: modpackModsDir, include: ['cloth-config-*.jar'])

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { wieldyourpower { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { wieldyourpower { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = "https://maven.minecraftforge.net/" }
}

mixin {
    add sourceSets.main, "${project.mod_id}.refmap.json"
    config "${project.mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"
    compileOnly clothJars
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_id', project.mod_id
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.mod_version, 'mod_id': project.mod_id
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : project.archives_name,
                'Specification-Vendor'    : project.maven_group,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : project.maven_group,
                'MixinConfigs'            : "${project.mod_id}.mixins.json"
        ])
    }
}
